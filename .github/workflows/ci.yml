name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install frontend dependencies
        run: npm ci

      - name: Static sanity checks
        run: npm run check:static

      - name: Dependency audit
        run: npm audit

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Mock UI smoke test
        run: npm run smoke:mock-ui

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri app
        run: npm run tauri build
