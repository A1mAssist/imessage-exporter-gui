name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install frontend dependencies
        run: npm ci

      - name: Static sanity checks
        run: npm run check:static

      - name: Dependency audit
        run: npm audit

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Mock UI smoke test
        run: npm run smoke:mock-ui

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Download imessage-exporter 4.1.0
        shell: pwsh
        run: |
          $url = "https://github.com/ReagentX/imessage-exporter/releases/download/4.1.0/imessage-exporter-x86_64-pc-windows-gnu.exe"
          $out = Join-Path $env:RUNNER_TEMP "imessage-exporter-x86_64-pc-windows-gnu.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          "IMESSAGE_EXPORTER_CI_PATH=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Real exporter CLI compatibility smoke
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-exporter-cli.ps1 -ExporterPath "$env:IMESSAGE_EXPORTER_CI_PATH"

      - name: Rust check
        working-directory: src-tauri
        run: cargo check
