[package]
name = "imessage-exporter-gui"
version = "0.2.0"
description = "Desktop GUI for imessage-exporter"
authors = ["A1mAssist"]
edition = "2021"
license = "GPL-3.0-only"

[workspace]
members = [
  ".",
  "vendor/imessage-exporter/imessage-database",
  "vendor/imessage-exporter/imessage-exporter",
]
resolver = "2"

[lib]
name = "imessage_exporter_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
imessage-database = { path = "vendor/imessage-exporter/imessage-database" }
imessage-exporter = { path = "vendor/imessage-exporter/imessage-exporter" }
fs2 = "0.4.3"
plist = "1.7.0"
rusqlite = { version = "=0.40.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
uuid = { version = "1.11.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.14.0"
